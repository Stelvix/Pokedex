{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pokédex{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'pokemon/css/theme.css' %}">
</head>
<body>

  <header class="site-header">
    <div class="container d-flex flex-wrap align-items-end justify-content-between gap-3">
      <div>
        <a class="site-title" href="/">Pokédex</a>
        <p class="site-subtitle">251 Pokémon à découvrir</p>
      </div>
      <form class="recherche" action="{% url 'aller' %}" method="get">
        <label for="numero" class="visually-hidden">Numéro du Pokémon</label>
        <input id="numero" name="numero" type="number" min="1" max="251" required placeholder="N° (1-251)">
        <button type="submit">Aller</button>
      </form>
    </div>
  </header>

  <main class="container py-5">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
