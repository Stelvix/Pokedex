{# Messages de réussite / d'erreur (ex. « Pikachu a rejoint l'équipe. ») #}
{% if messages %}
  <div class="eq-messages">
    {% for message in messages %}
      {% if message.level_tag == "error" %}
        <div class="alert alert-danger" role="alert">{{ message }}</div>
      {% else %}
        <div class="alert alert-{{ message.level_tag }}" role="status">{{ message }}</div>
      {% endif %}
    {% endfor %}
  </div>
{% endif %}
